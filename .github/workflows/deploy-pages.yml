name: Deploy Wedding Photo Quest

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Blazor application
        run: >
          dotnet publish WeddingPhotoAlbum/WeddingPhotoAlbum.csproj
          --configuration Release
          --output publish

      - name: Configure GitHub Pages base path
        run: |
          sed -i 's|<base href="/" />|<base href="/WeddingPhotoAlbum/" />|' publish/wwwroot/index.html

      - name: Create SPA fallback
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Disable Jekyll
        run: |
          touch publish/wwwroot/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
