<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>WeddingPhotoAlbum</title>

    <base href="/" />

    <link rel="preload"
          id="webassembly" />

    <link rel="stylesheet"
          href="lib/bootstrap/dist/css/bootstrap.min.css" />

    <link rel="stylesheet"
          href="css/app.css" />

    <link rel="icon"
          type="image/png"
          href="favicon.png" />

    <link href="WeddingPhotoAlbum.styles.css"
          rel="stylesheet" />

    <script type="importmap"></script>
</head>

<body>

    <div id="app">

        <svg class="loading-progress">
            <circle r="40%"
                    cx="50%"
                    cy="50%" />

            <circle r="40%"
                    cx="50%"
                    cy="50%" />
        </svg>

        <div class="loading-progress-text"></div>

    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.

        <a href="."
           class="reload">
            Reload
        </a>

        <span class="dismiss">
            🗙
        </span>
    </div>

    <!-- Personal board storage -->
    <script src="js/boardStorage.js"></script>

    <!-- Convert the completed board into a PNG -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <!-- Download and share the generated PNG -->
    <script src="js/boardExport.js"></script>

    <!-- Start Blazor: keep only one Blazor runtime script -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

</body>

</html>
